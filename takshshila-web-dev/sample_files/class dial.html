<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Speed Dial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #581c87 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 2rem;
            max-width: 32rem;
            width: 100%;
        }

        .title {
            font-size: 1.875rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
            color: #1f2937;
        }

        .dial-container {
            position: relative;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
        }

        .input-section {
            margin-bottom: 1rem;
        }

        .input-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .button-container {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .btn-primary {
            flex: 1;
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #2563eb;
            transform: scale(1.02);
        }

        .btn-primary:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
            transform: scale(1.02);
        }

        .status-display {
            margin-top: 1.5rem;
            background: linear-gradient(to right, #dbeafe, #f3e8ff);
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
        }

        .status-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #1e40af;
        }

        .status-subtitle {
            font-size: 0.875rem;
            color: #2563eb;
            margin-top: 0.25rem;
        }

        .no-selection {
            color: #6b7280;
            font-style: italic;
        }

        /* SVG Animations */
        .connection-line {
            transition: all 0.5s ease;
        }

        .marker-circle {
            transition: all 0.5s ease;
        }

        .class-text {
            transition: all 0.5s ease;
        }

        .blue-fill {
            transition: all 0.7s ease-out;
        }

        .glow-animation {
            animation: pulse-glow 1.5s infinite;
        }

        @keyframes pulse-glow {
            0% {
                r: 12px;
                opacity: 0.5;
            }
            50% {
                r: 18px;
                opacity: 0;
            }
            100% {
                r: 12px;
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="title">Class Speed Dial</h2>
        
        <!-- Speed Dial SVG -->
        <div class="dial-container">
            <svg width="400" height="320" style="overflow: visible;">
                <!-- Gradient definition -->
                <defs>
                    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#dbeafe" />
                        <stop offset="50%" stop-color="#60a5fa" />
                        <stop offset="100%" stop-color="#3b82f6" />
                    </linearGradient>
                </defs>

                <!-- Background semicircle track -->
                <path id="background-track" 
                      d="M 80 180 A 120 120 0 0 1 320 180"
                      fill="none"
                      stroke="#e5e7eb"
                      stroke-width="8"/>

                <!-- Active fill - blue area inside semicircle -->
                <path id="active-fill" 
                      d=""
                      fill="url(#blueGradient)"
                      opacity="0.7"
                      class="blue-fill"
                      style="display: none;"/>

                <!-- Class markers container -->
                <g id="class-markers"></g>

                <!-- Center hub -->
                <circle cx="200" cy="180" r="8" fill="#6b7280" opacity="0.6"/>
            </svg>
        </div>
        
        <!-- Input Section -->
        <div class="input-section">
            <label class="input-label">Enter Class (6-12):</label>
            <input type="number" 
                   id="class-input"
                   min="6" 
                   max="12" 
                   class="input-field"
                   placeholder="Enter class number">
        </div>
        
        <div class="button-container">
            <button id="set-class-btn" class="btn btn-primary">Set Class</button>
            <button id="reset-btn" class="btn btn-secondary" style="display: none;">Reset</button>
        </div>
        
        <!-- Status Display -->
        <div id="status-display" class="status-display">
            <p class="no-selection">Click on a class number to select</p>
        </div>
    </div>

    <script>
        class ClassSpeedDial {
            constructor() {
                this.selectedClass = null;
                this.isAnimating = false;
                this.classes = [6, 7, 8, 9, 10, 11, 12];
                this.radius = 120;
                this.centerX = 200;
                this.centerY = 180;
                
                this.init();
            }

            init() {
                this.createClassMarkers();
                this.bindEvents();
            }

            getAngle(classIndex) {
                return (Math.PI * classIndex) / (this.classes.length - 1);
            }

            getPosition(classIndex) {
                const angle = this.getAngle(classIndex);
                const x = this.centerX + this.radius * Math.cos(Math.PI - angle);
                const y = this.centerY - this.radius * Math.sin(Math.PI - angle);
                return { x, y };
            }

            createClassMarkers() {
                const markersContainer = document.getElementById('class-markers');
                
                this.classes.forEach((classNum, index) => {
                    const { x, y } = this.getPosition(index);
                    
                    // Calculate text position
                    const textRadius = this.radius + 30;
                    const textAngle = this.getAngle(index);
                    const textX = this.centerX + textRadius * Math.cos(Math.PI - textAngle);
                    const textY = this.centerY - textRadius * Math.sin(Math.PI - textAngle) + 5;
                    
                    // Create group for each class
                    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    group.setAttribute('data-class', classNum);
                    
                    // Connection line
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', this.centerX);
                    line.setAttribute('y1', this.centerY);
                    line.setAttribute('x2', x);
                    line.setAttribute('y2', y);
                    line.setAttribute('stroke', '#d1d5db');
                    line.setAttribute('stroke-width', '1');
                    line.setAttribute('opacity', '0.4');
                    line.classList.add('connection-line');
                    
                    // Marker circle
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', x);
                    circle.setAttribute('cy', y);
                    circle.setAttribute('r', '8');
                    circle.setAttribute('fill', '#94a3b8');
                    circle.setAttribute('stroke', '#64748b');
                    circle.setAttribute('stroke-width', '2');
                    circle.classList.add('marker-circle');
                    
                    // Class text
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', textX);
                    text.setAttribute('y', textY);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('font-weight', 'bold');
                    text.setAttribute('font-size', '14');
                    text.setAttribute('fill', '#374151');
                    text.classList.add('class-text');
                    text.textContent = classNum;
                    
                    // Glow effect (initially hidden)
                    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    glow.setAttribute('cx', x);
                    glow.setAttribute('cy', y);
                    glow.setAttribute('r', '12');
                    glow.setAttribute('fill', 'none');
                    glow.setAttribute('stroke', '#3b82f6');
                    glow.setAttribute('stroke-width', '2');
                    glow.setAttribute('opacity', '0.5');
                    glow.style.display = 'none';
                    glow.classList.add('glow-animation');
                    
                    group.appendChild(line);
                    group.appendChild(circle);
                    group.appendChild(text);
                    group.appendChild(glow);
                    
                    markersContainer.appendChild(group);
                });
            }

            bindEvents() {
                const input = document.getElementById('class-input');
                const setBtn = document.getElementById('set-class-btn');
                const resetBtn = document.getElementById('reset-btn');
                
                setBtn.addEventListener('click', () => this.handleSubmit());
                resetBtn.addEventListener('click', () => this.handleReset());
                
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.handleSubmit();
                    }
                });
                
                input.addEventListener('input', () => {
                    const hasValue = input.value.trim() !== '';
                    setBtn.disabled = !hasValue || this.isAnimating;
                });
            }

            handleSubmit() {
                const input = document.getElementById('class-input');
                const classNum = parseInt(input.value);
                
                if (this.classes.includes(classNum)) {
                    this.isAnimating = true;
                    this.selectedClass = classNum;
                    this.updateVisuals();
                    this.updateStatus();
                    
                    // Reset animation state
                    setTimeout(() => {
                        this.isAnimating = false;
                        document.getElementById('set-class-btn').disabled = false;
                    }, 600);
                } else {
                    alert('Please enter a class between 6 and 12');
                }
            }

            handleReset() {
                document.getElementById('class-input').value = '';
                this.selectedClass = null;
                this.isAnimating = false;
                this.updateVisuals();
                this.updateStatus();
            }

            updateVisuals() {
                const markersContainer = document.getElementById('class-markers');
                const activeFill = document.getElementById('active-fill');
                const resetBtn = document.getElementById('reset-btn');
                
                // Reset all markers
                markersContainer.querySelectorAll('g').forEach(group => {
                    const classNum = parseInt(group.getAttribute('data-class'));
                    const isActive = this.selectedClass === classNum;
                    
                    const line = group.querySelector('.connection-line');
                    const circle = group.querySelector('.marker-circle');
                    const text = group.querySelector('.class-text');
                    const glow = group.querySelector('.glow-animation');
                    
                    // Update connection line
                    line.setAttribute('stroke', isActive ? '#3b82f6' : '#d1d5db');
                    line.setAttribute('stroke-width', isActive ? '3' : '1');
                    line.setAttribute('opacity', isActive ? '0.8' : '0.4');
                    
                    // Update marker circle
                    circle.setAttribute('r', isActive ? '12' : '8');
                    circle.setAttribute('fill', isActive ? '#3b82f6' : '#94a3b8');
                    circle.setAttribute('stroke', isActive ? '#1d4ed8' : '#64748b');
                    
                    // Update text
                    text.setAttribute('font-size', isActive ? '18' : '14');
                    text.setAttribute('fill', isActive ? '#2563eb' : '#374151');
                    
                    // Show/hide glow
                    glow.style.display = isActive ? 'block' : 'none';
                });
                
                // Update blue fill
                if (this.selectedClass) {
                    const classIndex = this.classes.indexOf(this.selectedClass);
                    const angle = this.getAngle(classIndex);
                    const endX = this.centerX + this.radius * Math.cos(Math.PI - angle);
                    const endY = this.centerY - this.radius * Math.sin(Math.PI - angle);
                    
                    const fillPath = `M ${this.centerX - this.radius} ${this.centerY} A ${this.radius} ${this.radius} 0 0 1 ${endX} ${endY} L ${this.centerX} ${this.centerY} Z`;
                    activeFill.setAttribute('d', fillPath);
                    activeFill.style.display = 'block';
                    
                    resetBtn.style.display = 'block';
                } else {
                    activeFill.style.display = 'none';
                    resetBtn.style.display = 'none';
                }
            }

            updateStatus() {
                const statusDisplay = document.getElementById('status-display');
                
                if (this.selectedClass) {
                    let category;
                    if (this.selectedClass <= 8) category = "Middle School Level";
                    else if (this.selectedClass <= 10) category = "High School Level";
                    else category = "Senior Secondary Level";
                    
                    statusDisplay.innerHTML = `
                        <p class="status-title">Class ${this.selectedClass} Selected</p>
                        <p class="status-subtitle">${category}</p>
                    `;
                } else {
                    statusDisplay.innerHTML = '<p class="no-selection">Click on a class number to select</p>';
                }
            }
        }

        // Initialize the speed dial when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new ClassSpeedDial();
        });
    </script>
</body>
</html>
