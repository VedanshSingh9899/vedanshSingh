        function editbtn() {
            // Get the input values using class selectors
            const newFirstName = document.querySelector('.first_name_input').value;
            const newLastName = document.querySelector('.last_name_input').value;
            const newEmail = document.querySelector('.email_input').value;

            // Update the display elements
            document.querySelector('.first_name').textContent = newFirstName;
            document.querySelector('.last_name').textContent = newLastName;
            // Optionally update email if you have a display element for it
            // document.querySelector('.email').textContent = newEmail;

            // Save to localStorage so it persists after reload
            localStorage.setItem('userFirstName', newFirstName);
            localStorage.setItem('userLastName', newLastName);
            localStorage.setItem('userEmail', newEmail);

            // Close the edit box after saving
            editbox.classList.remove('open-edit');

            console.log("Profile updated successfully");
        }

        // Load profile info from localStorage on page load
        window.addEventListener('DOMContentLoaded', function () {
            const savedFirstName = localStorage.getItem('userFirstName');
            const savedLastName = localStorage.getItem('userLastName');
            const savedEmail = localStorage.getItem('userEmail');
            if (savedFirstName) {
                document.querySelector('.first_name').textContent = savedFirstName;
                const input = document.querySelector('.first_name_input');
                if (input) input.value = savedFirstName;
            }
            if (savedLastName) {
                document.querySelector('.last_name').textContent = savedLastName;
                const input = document.querySelector('.last_name_input');
                if (input) input.value = savedLastName;
            }
            if (savedEmail) {
                // If you have a display element for email, update it here
                const input = document.querySelector('.email_input');
                if (input) input.value = savedEmail;
            }
        });
        function triggerProfileImageInput() {
            document.querySelector('.profile_image_input').click();

        // Store the selected image in localStorage, but do not apply it yet
        function storeSelectedProfileImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const imageUrl = e.target.result;
                localStorage.setItem('pendingProfileImage', imageUrl);
                // Show preview in the edit image only
                const editImg = document.querySelector('.edit-info .circular-image');
                if (editImg) editImg.src = imageUrl;
            };
            reader.readAsDataURL(file);
        }
        // Apply the stored image everywhere after clicking Edit
        function applyStoredProfileImage() {
            const imageUrl = localStorage.getItem('pendingProfileImage');
            if (imageUrl) {
                document.querySelectorAll('.circular-image').forEach(img => {
                    img.src = imageUrl;
                });
                localStorage.setItem('profileImage', imageUrl);
                localStorage.removeItem('pendingProfileImage');
            }

        function resetAll(initial = false) {
            if (!initial) {
                subjectSelect.innerHTML = `<option value="">Select Subject</option>`;
                subjectSelect.disabled = true;
            }
            languageSelect.innerHTML = `<option value="">Select Language</option>`;
            chapterSelect.innerHTML = `<option value="">Select Chapter</option>`;
            languageSelect.disabled = true;
            chapterSelect.disabled = true;

            // Clear any displayed notes
            noteTabs.classList.add("hidden");
            allNotesDiv.classList.add("hidden");
            hwNotesDiv.classList.add("hidden");
            softNotesDiv.classList.add("hidden");
            allNotesDiv.innerHTML = "";
            hwNotesDiv.innerHTML = "";
            softNotesDiv.innerHTML = "";
        }

        classSelect.addEventListener("change", () => {
            resetAll();
            const cls = classSelect.value;
            if (!cls || !notesData[cls]) return;

            const subjects = Object.keys(notesData[cls]);
            if (subjects.length) {
                subjectSelect.disabled = false;
                subjectSelect.innerHTML = `<option value="">Select Subject</option>`;
                subjects.forEach(subj => {
                    subjectSelect.innerHTML += `<option value="${subj}">${subj}</option>`;
                });
            }

            noteTabs.classList.add("hidden");
            allNotesDiv.classList.add("hidden");
            hwNotesDiv.classList.add("hidden");
            softNotesDiv.classList.add("hidden");
        });

        subjectSelect.addEventListener("change", () => {
            const cls = classSelect.value;
            const subj = subjectSelect.value;

            // Reset language and chapter selections
            languageSelect.innerHTML = `<option value="">Select Language</option>`;
            chapterSelect.innerHTML = `<option value="">Select Chapter</option>`;
            languageSelect.disabled = true;
            chapterSelect.disabled = true;

            if (!cls || !subj || !notesData[cls][subj]) return;

            const languages = Object.keys(notesData[cls][subj]);
            if (languages.length) {
                languageSelect.disabled = false;
                languageSelect.innerHTML = `<option value="">Select Language</option>`;
                languages.forEach(lang => {
                    languageSelect.innerHTML += `<option value="${lang}">${lang}</option>`;
                });
            }

            // Hide note sections
            noteTabs.classList.add("hidden");
            allNotesDiv.classList.add("hidden");
            hwNotesDiv.classList.add("hidden");
            softNotesDiv.classList.add("hidden");
        });
        languageSelect.addEventListener("change", () => {
            const cls = classSelect.value;
            const subj = subjectSelect.value;
            const lang = languageSelect.value;

            // Reset chapter selection
            chapterSelect.innerHTML = `<option value="">Select Chapter</option>`;
            chapterSelect.disabled = true;

            if (!cls || !subj || !lang || !notesData[cls][subj][lang]) return;

            const chapters = Object.keys(notesData[cls][subj][lang]);
            if (chapters.length) {
                chapterSelect.disabled = false;
                chapterSelect.innerHTML = `<option value="">Select Chapter</option>`;
                chapters.forEach(ch => {
                    chapterSelect.innerHTML += `<option value="${ch}">${ch}</option>`;
                });
            }

            // Hide note sections
            noteTabs.classList.add("hidden");
            allNotesDiv.classList.add("hidden");
            hwNotesDiv.classList.add("hidden");
            softNotesDiv.classList.add("hidden");
        });
        function applyFilter() {
            const cls = classSelect.value;
            const subj = subjectSelect.value;
            const lang = languageSelect.value;
            const chap = chapterSelect.value;

            // Reset display
            noteTabs.classList.add("hidden");
            allNotesDiv.classList.add("hidden");
            hwNotesDiv.classList.add("hidden");
            softNotesDiv.classList.add("hidden");
            allNotesDiv.innerHTML = "";
            hwNotesDiv.innerHTML = "";
            softNotesDiv.innerHTML = "";

            if (!cls) {
                document.querySelector(".results-container").style.display = "block";
                allNotesDiv.innerHTML = "<p style='color: Black;'>--Please select the Class--</p>";
                allNotesDiv.classList.remove("hidden");
                return;
            }

            // Build the filtered data structure
            currentFilteredData = {};

            if (cls && subj && lang && chap) {
                // All filters selected - single chapter
                if (notesData[cls]?.[subj]?.[lang]?.[chap]) {
                    currentFilteredData[subj] = {
                        [lang]: notesData[cls][subj][lang][chap]
                    };
                }
            } else if (cls && subj && lang) {
                // Class, subject, and language selected
                if (notesData[cls]?.[subj]?.[lang]) {
                    currentFilteredData[subj] = {
                        [lang]: notesData[cls][subj][lang]
                    };
                }
            } else if (cls && subj) {
                // Class and subject selected
                if (notesData[cls]?.[subj]) {
                    currentFilteredData[subj] = notesData[cls][subj];
                }
            } else if (cls) {
                // Only class selected
                currentFilteredData = notesData[cls];
            }

            // With this:
            if (Object.keys(currentFilteredData).length > 0) {
                document.querySelector(".results-container").style.display = "block";
                noteTabs.classList.remove("hidden");

                // ADD THESE LINES - reset all tabs to inactive state
                document.getElementById("allBtn").classList.remove("active");
                document.getElementById("hwBtn").classList.remove("active");
                document.getElementById("softBtn").classList.remove("active");

                // Keep all content hidden until tab is clicked
                allNotesDiv.classList.add("hidden");
                hwNotesDiv.classList.add("hidden");
                softNotesDiv.classList.add("hidden");
            } else {
                alert("No notes found for the selected filters.");
            }
        }
        function showTab(type) {
            //reset Logic is here
            document.getElementById("allBtn").classList.remove("active");
            document.getElementById("hwBtn").classList.remove("active");
            document.getElementById("softBtn").classList.remove("active");

            allNotesDiv.classList.add("hidden");
            hwNotesDiv.classList.add("hidden");
            softNotesDiv.classList.add("hidden");

            // Clear previous results
            allNotesDiv.innerHTML = "";
            hwNotesDiv.innerHTML = "";
            softNotesDiv.innerHTML = "";

            // Reset active tabs
            document.getElementById("allBtn").classList.remove("active");
            document.getElementById("hwBtn").classList.remove("active");
            document.getElementById("softBtn").classList.remove("active");

            // Process the filtered data
            for (const subject in currentFilteredData) {
                for (const language in currentFilteredData[subject]) {
                    // Handle cases where we have specific chapters
                    if (typeof currentFilteredData[subject][language] === 'object' &&
                        !currentFilteredData[subject][language].handwritten) {
                        // This is the chapter-level data
                        for (const chapter in currentFilteredData[subject][language]) {
                            const note = currentFilteredData[subject][language][chapter];
                            createNoteLinks(subject, language, chapter, note, type);
                        }
                    } else {
                        // This is direct note data (when all filters are selected)
                        const note = currentFilteredData[subject][language];
                        createNoteLinks(subject, language, "", note, type);
                    }
                }
            }

            // Show the appropriate tab
            if (type === "all") {
                allNotesDiv.classList.remove("hidden");
                document.getElementById("allBtn").classList.add("active");
            } else if (type === "hw") {
                hwNotesDiv.classList.remove("hidden");
                document.getElementById("hwBtn").classList.add("active");
            } else if (type === "soft") {
                softNotesDiv.classList.remove("hidden");
                document.getElementById("softBtn").classList.add("active");
            }
        }

        // Helper function to create note links
        function createNoteLinks(subject, language, chapter, note, type) {
            const chapterText = chapter ? ` - ${chapter}` : "";

            if (note.handwritten) {
                const hwLink = `<a class="Show-PDF" href="${note.handwritten}" target="_blank">${subject}-${language} 📒 Copy Notes${chapterText}</a>`;
                if (type === "all" || type === "hw") {
                    allNotesDiv.innerHTML += hwLink;
                }
                if (type === "hw") {
                    hwNotesDiv.innerHTML += hwLink;
                }
            }

            if (note.softcopy) {
                const scLink = `<a class="Show-PDF" href="${note.softcopy}" target="_blank">${subject}-${language} 📄 Digital Notes${chapterText}</a>`;
                if (type === "all" || type === "soft") {
                    allNotesDiv.innerHTML += scLink;
                }
                if (type === "soft") {
                    softNotesDiv.innerHTML += scLink;
                }
            }
        }
        document.addEventListener("click", function (e) {
            if (e.target.classList.contains("Show-PDF")) {
                e.preventDefault();
                const pdfPath = e.target.getAttribute("href");
                document.getElementById("pdfFrame").src = pdfPath + "#zoom=100";
                document.getElementById("pdfViewer").style.display = "flex";
            }
        });

        document.getElementById("closePdfBtn").addEventListener("click", function () {
            document.getElementById("pdfViewer").style.display = "none";
            document.getElementById("pdfFrame").src = "";
        });
        function applyTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                document.querySelector('.toggle-btn').textContent = '🌙 Dark Mode';
            } else {
                document.body.classList.remove('dark-mode');
                document.querySelector('.toggle-btn').textContent = '☀️ Light Mode';
            }
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.querySelector('.toggle-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
        }

        // Run this when the page loads
        window.onload = applyTheme;
    </script>
</body>

</html>
