<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/Takshshila.css">
    <style>
        .boxes {
            width: 80vw;
            height: fit-content;
            border: 2px solid black;
            background-color: white;
            margin: 30px auto;
        }

        .inner-box {
            background-color: #56f000;
            height: 100%;
        }

        .information {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 60px;
            
            align-items: center;
            margin-bottom: 40px;
            justify-content: space-evenly;
        }

        .test-tab {
            margin: 0px;
            padding: 0px;
        }

        .progress-container {
            margin: 0;
            width: 100%;
        }
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        .headline {
            text-align: center;
            color: #000000;
            font-family: "Poppins", sans-serif;
            width: 100%;
            padding: 10px 0px 10px 0px;
            background-color: #f6c90e;
            font-size: 1.4em;
            font-weight: bold;
            margin:0;
        }
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
        .font {
            font-size: large;
            font-family: "Roboto", sans-serif;
            display: flex;
            flex-direction: column;
            row-gap: 30px;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-decoration"></div>
        <div class="header-decoration"></div>
        <h1>Takshshila</h1>
        <p>Your learning platform</p>
        <button class="profile" id="subProfile" onclick="myprofile()"><img class="circular-image"
                src="https://png.pngtree.com/png-clipart/20231002/original/pngtree-cute-cartoon-cat-png-image_13060428.png"
                alt="Profile" width="40px" height="40px"></button>
        <div class="box" id="subMenu">
            <div class="basic-info">
                <table class="sub-profile">

                    <tr>
                        <td><button class="profile2" id="subProfile2" style="background-color:transparent;border:none"
                                onclick="off()">
                                <img class="circular-image"
                                    src="https://png.pngtree.com/png-clipart/20231002/original/pngtree-cute-cartoon-cat-png-image_13060428.png"
                                    alt="Profile" width="40px" height="40px">
                            </button></td>
                    </tr>
                </table>
                <table>
                    <tr style="color:#000000;" class="text">
                        <td><span class="first_name">Aditya</span>
                            <span class="last_name">vishwakarma</span>
                        </td>
                        <td id="username">karma@1123</td>
                    </tr>
                </table>
            </div>
            <div
                style="margin-top:5px;width:100vw;height:1px;border:1px solid rgba(255, 255, 255, 0.63); background-color:#000000;">
            </div>
            <div class="inner-btn">
                <table class="edit-profile">
                    <tr>
                        <td>
                            <button class="edit" onclick="edit_box_open()">
                                <span>Edit-profile</span>
                                <span>
                                    <?xml version="1.0" ?><svg class="feather feather-edit" fill="none" height="24"
                                        stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="2" viewBox="0 0 24 24" width="18"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                                    </svg>
                                </span>
                            </button>
                        </td>
                    </tr>

                </table>
                <table>
                    <tr>
                        <td>
                            <button class="toggle-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>

                        </td>
                    </tr>
                </table>
            </div>
        </div>
        <div class="editbox" id="editbox">
            <div style="display:flex;flex-direction:row;">
                <div style="position:relative; margin-left:10px;"><button class="back" id="back" onclick="back()"
                        style="border:none; cursor:pointer;">
                        <?xml version="1.0" ?>
                        <!DOCTYPE svg
                            PUBLIC '-//W3C//DTD SVG 1.1//EN' 'http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd'><svg
                            height="25px" id="Layer_1" style="enable-background:new 0 0 512 512;" version="1.1"
                            viewBox="0 0 512 512" width="20px" xml:space="preserve" xmlns="http://www.w3.org/2000/svg"
                            xmlns:xlink="http://www.w3.org/1999/xlink">
                            <polygon
                                points="352,128.4 319.7,96 160,256 160,256 160,256 319.7,416 352,383.6 224.7,256 " />
                        </svg>
                    </button>
                </div>

                <div style="margin-inline-start: 70px;">Edit&nbsp;information</div>
            </div>
            <table>
                <br>

                <tr class="edit-info">
                    <td>
                        <button style="border: none;background: transparent;cursor: pointer;"
                            onclick="triggerProfileImageInput()">
                            <img src="https://png.pngtree.com/png-clipart/20231002/original/pngtree-cute-cartoon-cat-png-image_13060428.png"
                                width="50px" height="50px" class="circular-image" alt="profile">
                        </button>
                    </td>
                    <td class="input">
                        <input type="file" accept="image/*" class="profile_image_input" style="display:none"
                            onchange="storeSelectedProfileImage(event)">
                    </td>
                    <td>Name:</td>
                    <td class="input">
                        <input type="text" value="Aditya" placeholder="First Name" class="first_name_input">
                    </td>
                    <td class="input">
                        <input type="text" value="Vishwakarma" placeholder="Last Name" class="last_name_input">

                    </td>
                    <td>Phone&nbsp;Number:</td>
                    <td class="input"><input type="tel" value="8920157139" placeholder="Enter your phone number"
                            class="phone_number_input"></td>
                    <td>Email:</td>
                    <td class="input">
                        <input type="email" value="xyz@gmail.com" placeholder="Enter Your Email" class="email_input">
                    </td>
                    <td style="margin-left: 107px;margin-top: 13px;"><button
                            onclick="editbtn(); applyStoredProfileImage();">Edit</button></td>
                </tr>
            </table>
        </div>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/videos">Videos</a>
        <a href="/test-series">Test Series</a>
        <a href="/blogs">Blog</a>
        <a href="/contact">Contact Us</a>
    </nav>
    <main>
        <div class="boxes">
            <h2 class="headline">📊 Test Progress</h2>
            <div class="inner-box">

                <div class="information">
                    <div class="test_profile">
                        <button style="border: none;background: transparent;cursor: pointer;">
                            <img src="https://png.pngtree.com/png-clipart/20231002/original/pngtree-cute-cartoon-cat-png-image_13060428.png"
                                width="70px" height="70px" class="circular-image" alt="profile">
                        </button>
                    </div>
                    <div class="personalInfo font">
                        <div>Name&#58;<span class="name">Sahil</span></div>
                        <div>Class&#58;<span class="class">7</span></div>
                    </div>
                    <div class="scores font">
                        <div>Test&nbsp;Score&#58;<span class="test_score">10</span>&#47;<span>300</span></div>
                        <div>Test&nbsp;Attempted&#58;<span class="test_attempted">2</span>&#47;<span>420</span></div>
                    </div>
                    <div class="progress font">
                        <div>Percentage&#58;<span class="percentage">2</span>&#37;</div>
                        <div>Points&#58;<span class="points">10</span></div>
                    </div>
                </div>
                <div class="test-tab">
                    <div class="progress-container">
                        <div id="progress-bar" class="progress-bar">0% Complete</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
