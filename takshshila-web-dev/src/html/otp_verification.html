<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Takshshila - OTP Verification</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary: #2f8f83;
      --secondary: #3a7bd5;
      --text-light: #f4fafd;
      --text-dark: #1e2a3a;
      --button-shadow: rgba(0, 0, 0, 0.15);
      --success: #44c877;
      --error: #dc3545;
      --warning: #ffc107;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg,#1bb9f8, #d7fd4f);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://www.transparenttextures.com/patterns/diamond-upholstery.png');
      opacity: 0.05;
      z-index: 0;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.12;
      animation: float 8s ease-in-out infinite;
      z-index: 0;
    }

    .shape1 {
      width: 200px;
      height: 200px;
      background: var(--primary);
      top: -60px;
      left: -60px;
    }

    .shape2 {
      width: 150px;
      height: 150px;
      background: var(--secondary);
      bottom: -40px;
      right: -40px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .otp-container {
      background: #0f1f14;
      background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
      color: var(--text-light);
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 450px;
      position: relative;
      z-index: 1;
      animation: slideIn 1s ease forwards;
      opacity: 0;
      text-align: center;
    }

    @keyframes slideIn {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo h1 {
      font-size: 2rem;
      color: #ffffff;
      font-weight: 600;
    }

    .logo p {
      color: #ffffff;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .status {
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .status.loading {
      background: rgba(60, 123, 213, 0.2);
      color: #82e9d2;
      border: 1px solid rgba(130, 233, 210, 0.3);
    }

    .status.success {
      background: rgba(68, 200, 119, 0.2);
      color: var(--success);
      border: 1px solid rgba(68, 200, 119, 0.3);
    }

    .status.error {
      background: rgba(220, 53, 69, 0.2);
      color: var(--error);
      border: 1px solid rgba(220, 53, 69, 0.3);
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #82e9d2;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      color: #ddfdf0;
      text-align: left;
    }

    .action-btn {
      padding: 0.9rem;
      background: linear-gradient(135deg, #44c877, #3a7bd5);
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 12px var(--button-shadow);
      transition: all 0.3s;
      font-weight: 600;
      position: relative;
    }

    .action-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }
    
    .action-btn:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .action-btn.loading::before {
      content: "";
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid white;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
    }

    #otp-section {
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .otp-inputs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .otp-inputs input {
      width: 45px;
      height: 50px;
      text-align: center;
      font-size: 1.5rem;
      border: 1px solid #3a7bd5;
      border-radius: 8px;
      background-color: #1b2f24;
      color: #eafff6;
      outline: none;
      transition: all 0.3s;
    }
    
    .otp-inputs input:focus {
        border-color: #7cffc1;
        box-shadow: 0 0 0 2px rgba(124, 255, 193, 0.2);
        transform: scale(1.05);
    }

    .otp-inputs input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
        font-size: 0.9rem;
        margin-top: 1rem;
        padding: 0.5rem;
        border-radius: 6px;
        min-height: 20px;
    }

    .message.success {
        background: rgba(68, 200, 119, 0.1);
        color: var(--success);
        border: 1px solid rgba(68, 200, 119, 0.2);
    }

    .message.error {
        background: rgba(220, 53, 69, 0.1);
        color: var(--error);
        border: 1px solid rgba(220, 53, 69, 0.2);
    }

    .resend-link {
        margin-top: 1rem;
        font-size: 0.9rem;
    }

    .resend-link a {
        color: #82e9d2;
        text-decoration: none;
        font-weight: 500;
        cursor: pointer;
        transition: color 0.3s;
    }

    .resend-link a:hover {
        text-decoration: underline;
        color: #7cffc1;
    }

    @media (max-width: 480px) {
      .otp-container {
        padding: 2rem;
      }

      .logo h1 {
        font-size: 1.6rem;
      }
      
      .otp-inputs input {
        width: 40px;
        height: 45px;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="shape shape1"></div>
  <div class="shape shape2"></div>

  <div class="otp-container">
    <div class="logo">
      <h1>OTP Verification</h1>
      <p>A secure code has been generated for your account.</p>
    </div>

    <div id="status" class="status loading">
      <div class="spinner"></div>
      Generating OTP...
    </div>

    <form id="otpForm" onsubmit="return false;">
      <div id="otp-section">
        <label for="otp">Enter the 6-digit code</label>
        <div class="otp-inputs" id="otp-inputs">
          <input type="text" maxlength="1" class="otp-input" disabled />
          <input type="text" maxlength="1" class="otp-input" disabled />
          <input type="text" maxlength="1" class="otp-input" disabled />
          <input type="text" maxlength="1" class="otp-input" disabled />
          <input type="text" maxlength="1" class="otp-input" disabled />
          <input type="text" maxlength="1" class="otp-input" disabled />
        </div>
        <button id="verifyBtn" class="action-btn" disabled>Verify OTP</button>
        <div class="resend-link">
            <p>Need a new code? <a onclick="generateNewOtp()">Generate New OTP</a></p>
        </div>
      </div>
      
      <div id="message" class="message"></div>
    </form>
  </div>

  <script>
    const otpInputs = document.querySelectorAll('.otp-input');
    const verifyBtn = document.getElementById('verifyBtn');
    const messageDiv = document.getElementById('message');
    const statusDiv = document.getElementById('status');
    let isGenerating = false;

    // Generate OTP when page loads
    window.addEventListener('load', () => {
        generateOtp();
    });

    async function generateOtp() {
        if (isGenerating) return;
        isGenerating = true;
        
        try {
            // Reset UI
            updateStatus('loading', '<div class="spinner"></div>Generating OTP...');
            clearMessage();
            clearOtpInputs();
            
            const response = await fetch('../../backend/user_login_tracking_php_files/genrate_email_OTP.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'same-origin'
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const responseText = await response.text();
            
            // Check if response is HTML (error page)
            if (responseText.trim().startsWith('<!DOCTYPE') || responseText.trim().startsWith('<html')) {
                console.error("Server returned HTML:", responseText);
                throw new Error('Server returned an error page instead of JSON');
            }
            
            let data;
            try {
                data = JSON.parse(responseText);
            } catch (parseError) {
                console.error("Invalid JSON:", responseText);
                throw new Error(`Invalid JSON response: ${parseError.message}`);
            }
            
            if (data.success) {
                updateStatus('success', '✅ An OTP has been sent to your email.');
                showMessage('Please check your inbox and enter the code below.', 'success');
                
                // Enable OTP inputs
                otpInputs.forEach(input => {
                    input.disabled = false;
                });
                
                // Focus on first input
                otpInputs[0].focus();
            } else {
                throw new Error(data.message || 'Failed to generate OTP');
            }
            
        } catch (error) {
            updateStatus('error', `❌ Error: ${error.message}`);
            showMessage('Could not generate an OTP. Please try again or contact support.', 'error');
        } finally {
            isGenerating = false;
        }
    }

    async function generateNewOtp() {
        clearOtpInputs();
        await generateOtp();
    }

    function updateStatus(type, html) {
        statusDiv.className = `status ${type}`;
        statusDiv.innerHTML = html;
    }

    function showMessage(msg, type) {
        messageDiv.textContent = msg;
        messageDiv.className = `message ${type}`;
    }

    function clearMessage() {
        messageDiv.textContent = '';
        messageDiv.className = 'message';
    }

    function clearOtpInputs() {
        otpInputs.forEach(input => {
            input.value = '';
            input.disabled = true;
        });
        verifyBtn.disabled = true;
    }

    // OTP input handling
    otpInputs.forEach((input, index) => {
        input.addEventListener('input', () => {
            // Only allow digits
            input.value = input.value.replace(/[^0-9]/g, '');
            
            // Move to next input if a digit is entered
            if (input.value.length === 1 && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
            }
            checkOtpCompletion();
        });

        input.addEventListener('keydown', (e) => {
            // Move to previous input on backspace if current input is empty
            if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                otpInputs[index - 1].focus();
            }
        });
    });

    function checkOtpCompletion() {
        let otp = '';
        otpInputs.forEach(input => {
            otp += input.value;
        });
        verifyBtn.disabled = otp.length !== 6;
    }

    verifyBtn.addEventListener('click', async () => {
        let enteredOtp = '';
        otpInputs.forEach(input => { enteredOtp += input.value; });

        verifyBtn.disabled = true;
        verifyBtn.classList.add('loading');
        verifyBtn.textContent = 'Verifying...';
        otpInputs.forEach(input => input.disabled = true);
        clearMessage();

        try {
            const response = await fetch('../../backend/user_login_tracking_php_files/verify_otp.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ otp: enteredOtp }),
                credentials: 'same-origin'
            });

            const responseText = await response.text();
            let data;
            try {
                data = JSON.parse(responseText);
            } catch (e) {
                console.error("Failed to parse JSON from verification script:", responseText);
                throw new Error("Server returned an invalid response during verification.");
            }

            if (response.ok && data.success) {
                // The backend now handles finalization. If we get success, the account is created.
                updateStatus('success', '✅ Account created successfully!');
                showMessage('Redirecting you to the home page...', 'success');
                verifyBtn.classList.remove('loading');
                verifyBtn.textContent = 'Success!';
                
                setTimeout(() => { 
                    window.location.href = 'Homes.html'; 
                }, 1500);
            } else {
                // Handle failure from either OTP check or finalization
                showMessage(`❌ ${data.message || 'Verification failed. Please try again.'}`, 'error');
                verifyBtn.classList.remove('loading');
                verifyBtn.textContent = 'Verify OTP';
                otpInputs.forEach(input => {
                    input.value = '';
                    input.disabled = false;
                });
                otpInputs[0].focus();
                checkOtpCompletion();
            }
        } catch (error) {
            console.error('Verification process error:', error);
            updateStatus('error', '❌ Verification Failed');
            showMessage(`A critical error occurred: ${error.message}. Please try again.`, 'error');
            verifyBtn.classList.remove('loading');
            verifyBtn.textContent = 'Verify OTP';
            otpInputs.forEach(input => input.disabled = false);
            checkOtpCompletion();
        }
    });
  </script>

</body>
</html>
