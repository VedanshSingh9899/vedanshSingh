<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Takshshila | Test Series</title>
  <link rel="stylesheet" href="Takshshila.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>Test Series</h1>
    <p>Track your progress & take practice tests</p>
  </header>

  <section class="test-tab">
    <h2 class="headline">📊 Test Progress</h2>
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar">0% Complete</div>
    </div>

    <div class="test-list">
      <div class="test-item" data-marks="16" data-total="60">
        <h3>Maths Term 1</h3>
        <p class="marks">16/60</p>
        <p class="skull">💀💀</p>
        <button class="Butn">Start Test</button>
      </div>
      <div class="test-item" data-marks="0" data-total="60">
        <h3>Science Full Syllabus</h3>
        <p class="marks">Unattempted</p>
        <p class="skull">💀💀💀</p>
        <button class="Butn">Start Test</button>
      </div>
      <div class="test-item" data-marks="42" data-total="60">
        <h3>Social Science Map Quiz</h3>
        <p class="marks">42/60</p>
        <p class="skull">💀</p>
        <button class="Butn">Start Test</button>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2025 Takshshila. All rights reserved.</p>
  </footer>
  <script src="Takshshila.js">
  </script>
  </body>
  </html>
