        body {

        .dark-mode {

        .toggle-btn {

            border: none;

            border-radius: 5px;

        .header-decoration {

            left: 50px;

        }

        .header-decoration:nth-child(2) {

            height: 80px;
            top: auto;
            bottom: 20px;
            right: 50px;
            left: auto;
        }

        .box {

            max-height: 0px;
            overflow: hidden;
            width: 200px;
            height: 140px;
            position: absolute;
            top: 55px;
            right: 45px;
            z-index: 1000;

        .info {

        @keyframes fadeInDown {
            from {

                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            from {
                transform: translateY(0);

            to {
                transform: translateY(10px);
            }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {

            }

            }

    <script>
        const subMenu = document.getElementById("subMenu");

    function myprofile() {
      subMenu.classList.toggle("open-menu");
    }

        function applyTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                document.querySelector('.toggle-btn').textContent = '🌙 Dark Mode';
            } else {
                document.body.classList.remove('dark-mode');
                document.querySelector('.toggle-btn').textContent = '☀️ Light Mode';
            }
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.querySelector('.toggle-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
        }

        window.onload = applyTheme;
    </script>
</body>
